name: Build IPTV
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install node-fetch@2

      - name: 执行脚本
        run: node conve.js

      - name: 提交生成文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt vod.txt live.m3u epg.xml
          git commit -m "auto update source"
          git push
