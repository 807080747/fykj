name: Build IPTV Live
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 node‑fetch@2
        run: npm install node-fetch@2

      - name: 执行脚本生成源文件
        run: node conve.js

      - name: 提交生成的文件回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.txt live.m3u
          if git diff --cached --quiet; then
            echo "文件无更新，跳过提交推送"
          else
            git commit -m "auto update iptv source"
            git push
          fi
