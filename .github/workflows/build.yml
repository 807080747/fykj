name: Build IPTV Live
on:
  workflow_dispatch: # 手动点击运行
  schedule:
    - cron: '0 6 * * *' # UTC时间，每天早上6点（北京时间14点自动执行）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖 node‑fetch@2
        run: npm install node-fetch@2

      - name: 执行聚合脚本生成 live.txt
        run: node conve.js

      - name: 提交生成的 live.txt 回仓库
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add live.txt
          git commit -m "auto update live.txt" || echo "无变更跳过提交"
          git push
